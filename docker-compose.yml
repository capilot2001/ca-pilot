# Local dev topology for LedgerFlow v2.
#
# OCR runs IN-PROCESS inside `server` for the migration (ADR-0004 + Decision:
# in-process first), so there is one backend service. The `client` (Next.js) is
# added in Part B; the split-out OCR service (Cloud Run) comes post-migration.
#
# The server image builds from the REPO ROOT (context: .) because it runs three
# source roots in one process — see server/Dockerfile.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      LEDGERFLOW_DB: /data/ledgerflow.db
      OCR_MODE: in_process
      CORS_ORIGINS: http://localhost:3000
      # Google ADC for Vision + Gemini: either set GOOGLE_APPLICATION_CREDENTIALS
      # to a mounted key, or mount your local ADC (see the commented volume).
      # Full reference: deploy/env/server.env.example
      # GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
    volumes:
      - ledgerflow-db:/data
      # Local Google ADC (after `gcloud auth application-default login`):
      # - ~/.config/gcloud:/root/.config/gcloud:ro

volumes:
  ledgerflow-db:
